[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhanes-diabetes-showcase"
version = "0.2.0"
description = "Reproducible diabetes screening model using NHANES 2017–March 2020 data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", 
    "pandas>=2.2", 
    "pyarrow>=15.0", 
    "scipy>=1.12", 
    "matplotlib>=3.8", 
    "seaborn>=0.13", 
    "statsmodels>=0.14", 
    "scikit-learn>=1.5", 
    "fairlearn>=0.11", 
    "tabulate>=0.9",
    "jupyter>=1.0", 
    "ipykernel>=6.29", 
    "jupytext>=1.16", 
    "nbstripout>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "tmp", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Notebook setup resolves the repository root before importing the local package.
"notebooks/*.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
